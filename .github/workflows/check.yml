# Runs the sim check and browser smoke tests, then commits tests/status.txt
# and screenshots to the `checks` branch. Never pushes to main or gh-pages,
# so it cannot retrigger itself or pages.yml.
# Re-run: Actions > check > Run workflow, or edit tests/trigger.txt on main.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tower-checks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sim check
        id: sim
        continue-on-error: true
        run: |
          mkdir -p tests/out
          node tests/sim-check.mjs 2>&1 | tee tests/out/sim.log

      - name: Install Playwright Chromium (CI only)
        id: pw
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1
          npx --no-install playwright install --with-deps chromium

      - name: Smoke test (local copy of this commit)
        id: smoke_local
        if: steps.pw.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 2
          node tests/smoke.mjs local http://127.0.0.1:8000/ 2>&1 | tee tests/out/smoke-local.log

      - name: Smoke test (live GitHub Pages)
        id: smoke_live
        if: steps.pw.outcome == 'success'
        continue-on-error: true
        run: |
          # Give pages.yml a moment to sync gh-pages after a push.
          sleep 45
          node tests/smoke.mjs live https://derpfacejr.github.io/daily-tower-web/ 2>&1 | tee tests/out/smoke-live.log

      - name: Write status.txt and push to checks branch
        if: always()
        env:
          SIM: ${{ steps.sim.outcome }}
          LOCAL: ${{ steps.smoke_local.outcome }}
          LIVE: ${{ steps.smoke_live.outcome }}
          PW: ${{ steps.pw.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          res() { case "$1" in success) echo PASS;; failure) echo FAIL;; *) echo "NOT_RUN(${1:-none})";; esac; }
          mkdir -p tests/out
          errs=$(grep -h '^ERROR\[' tests/out/smoke-*.log 2>/dev/null | head -n 40 || true)
          fails=$(grep -h '^FAIL' tests/out/sim.log tests/out/smoke-*.log 2>/dev/null | head -n 40 || true)
          {
            echo "SIM=$(res "$SIM")"
            echo "SMOKE_LOCAL=$(res "$LOCAL")"
            echo "SMOKE_LIVE=$(res "$LIVE")"
            echo "PLAYWRIGHT_INSTALL=$(res "$PW")"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${RUN_URL}"
            echo "SHA=${GITHUB_SHA}"
            echo "EVENT=${GITHUB_EVENT_NAME}"
            echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LIVE_URL=https://derpfacejr.github.io/daily-tower-web/"
            echo "CONSOLE_ERRORS:"
            echo "${errs:-none}"
            echo "FAILED_CHECKS:"
            echo "${fails:-none}"
          } > tests/out/status.txt
          cat tests/out/status.txt

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT="$RUNNER_TEMP/checks-wt"
          if git ls-remote --exit-code --heads origin checks > /dev/null 2>&1; then
            git fetch --depth=1 origin +refs/heads/checks:refs/remotes/origin/checks
            git worktree add -B checks "$WT" refs/remotes/origin/checks
          else
            git worktree add --detach "$WT" HEAD
            git -C "$WT" checkout --orphan checks
            git -C "$WT" rm -rf -q .
          fi
          mkdir -p "$WT/tests"
          rm -f "$WT"/tests/*.png "$WT"/tests/*.log "$WT"/tests/*.json
          cp tests/out/status.txt "$WT/tests/status.txt"
          for f in tests/out/*.png tests/out/*.log tests/out/*.json; do
            [ -e "$f" ] && cp "$f" "$WT/tests/"
          done
          git -C "$WT" add -A
          git -C "$WT" commit -q -m "checks: run ${GITHUB_RUN_ID} for ${GITHUB_SHA}" || echo "nothing to commit"
          git -C "$WT" push origin HEAD:refs/heads/checks

      - name: Fail the job if any check did not pass
        if: always()
        run: |
          if grep -Eq '^(SIM|SMOKE_LOCAL|SMOKE_LIVE)=(FAIL|NOT_RUN)' tests/out/status.txt; then
            echo "At least one check did not pass; see tests/status.txt on branch checks."
            exit 1
          fi
