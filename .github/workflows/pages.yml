# Keeps the gh-pages branch identical to main. GitHub Pages serves gh-pages.
# Uses only the built-in GITHUB_TOKEN; no Pages admin API, no third-party actions.
name: Sync main to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Force-push main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
