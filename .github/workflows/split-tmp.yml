name: split-tmp
on:
  push:
    branches: [sim-read-tmp]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: probe
        run: |
          mkdir -p tmp
          node tests/balance-probe.mjs > tmp/probe.txt 2>&1 || true
          node tests/sim-check.mjs > tmp/simcheck.txt 2>&1 || true
      - name: commit
        run: |
          git config user.name 'probe-bot'
          git config user.email 'probe-bot@users.noreply.github.com'
          git add tmp
          git commit -m 'tmp probe results [skip ci]' || true
          git pull --rebase origin sim-read-tmp || true
          git push origin HEAD:sim-read-tmp
